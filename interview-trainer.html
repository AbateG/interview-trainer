()=>{const b=R(5,12)*1000,o=R(2,9)*100,d=R(1,6)*100;return[`The bank statement shows ${usd(b)}. Outstanding checks total ${usd(o)} and a deposit in transit is ${usd(d)}. What is the adjusted bank balance?`,b-o+d,"Statement balance - outstanding checks + deposits in transit."]},
()=>{const s=R(1,4)*1000,y=R(3,6),k=R(2,5)*1000;return[`Equipment costs ${usd(s+y*k)} with a salvage value of ${usd(s)} and a ${y}-year life. What is the yearly straight-line depreciation?`,k,"(Cost - salvage value) / years of life."]},

()=>{const a=R(5,30)*100;return[`A ${usd(a)} invoice is 30 days overdue and the firm charges a 2% late fee. What is the fee?`,a*.02,"Late fee = amount x 2%."]},

const TK=/\s*(?:(\d+\.?\d*|\.\d+)|"((?:[^"]|"")*)"|(\$?[A-Z]{1,2}\$?\d+(?::\$?[A-Z]{1,2}\$?\d+)?|\$?[A-Z]{1,2}:\$?[A-Z]{1,2})(?![\w(.])|([A-Z][A-Z0-9.]*)(?=\()|(TRUE|FALSE)\b|(<>|<=|>=|[-+*\/^&=<>(),;:]))/gy;
const refn=s=>{s=s.replace(/\$/g,"");const p=s.split(":");if(p.length==1)return()=>{const v=val(s);if(v instanceof Er)throw v.m;return v};const pt=x=>{const m=/^([A-Z]+)(\d*)$/.exec(x);return[cnum(m[1]),m[2]?+m[2]:0]},a=pt(p[0]),b=pt(p[1]),r1=a[1]||1,r2=b[1]||NR;return()=>{const o=[];for(let r=r1;r<=r2;r++){const w=[];for(let c=a[0];c<=b[0];c++){const v=val(ref(r,c));if(v instanceof Er)throw v.m;w.push(v)}o.push(w)}return new Rg(o)}};
const fn=(nm,a)=>()=>{if(nm=="IF")return tr(a[0]())?(a[1]?a[1]():true):(a[2]?a[2]():false);if(nm=="IFERROR"){try{return a[0]()}catch(e){return a[1]()}}if(nm=="IFS"){for(let j=0;j<a.length;j+=2)if(tr(a[j]()))return a[j+1]();throw"#N/A"}const f=F[nm];if(!f)throw"#NAME?";return f(...a.map(x=>x()))};

["Mark April 15 as a deadline without a start time?",["Tick All day","Start at 12:00 AM","Make it recurring daily","Add a guest"],"All-day events sit in the date header and suit deadlines."],
["Two clients want the same slot. First move?",["Check availability, offer alternatives, confirm in writing","Accept both","Ignore the second","Cancel the first"],"Never double-book: offer other slots and confirm the final time by email."],
["Individual returns (calendar year) are due when?",["April 15","March 15","January 31","June 15"],"Form 1040 is due April 15; Form 4868 extends filing to October 15, not payment. Weekend or holiday dates move to the next business day."],
["Partnership and S-corp returns (calendar year) are due when?",["March 15","April 15","January 31","September 15"],"Forms 1065 and 1120-S are due March 15; Form 7004 extends them to September 15."],
["W-2s and 1099-NECs must reach recipients by?",["January 31","February 28","March 15","April 15"],"January 31 is the standard date."],
["How do you show colleagues when you can be booked (Mon-Fri 9-6 ET)?",["Settings > Working hours and location","Create an all-day event","Rename the calendar","Delete notifications"],"Working hours tell others when you are available."]],

a:[
["The accounting equation is:",["Assets = Liabilities + Equity","Assets = Revenue - Expenses","Equity = Assets + Liabilities","Liabilities = Assets + Equity"],"Everything a business owns is financed by debt (liabilities) or by the owners (equity)."],
["A client pays cash for services. Which entry is right?",["Debit Cash, credit Revenue","Debit Revenue, credit Cash","Debit Cash, credit Expense","Debit Expense, credit Cash"],"Cash (an asset) increases with a debit; revenue increases with a credit."],
["A business pays $300 of office rent in cash. Entry?",["Debit Rent expense, credit Cash","Debit Cash, credit Rent expense","Debit Rent expense, credit Revenue","Debit Cash, credit Rent payable"],"Expenses increase with debits; cash decreases with a credit."],
["Which method records revenue when it is earned, even if unpaid?",["Accrual","Cash","Both","Neither"],"Accrual records revenue when earned and expenses when incurred; cash records them when money moves."],
["What is accounts receivable?",["Money customers owe the business","Money the business owes suppliers","Cash in the bank","Owner investment"],"A/R is an asset: invoices sent but not yet paid. What you owe suppliers is accounts payable."],
["In a bank reconciliation, an outstanding check is:",["A check written but not yet cleared by the bank","A deposit the bank has not recorded","A bank fee","A duplicate entry"],"It lowers the real balance but has not reached the bank statement yet. A deposit in transit is the opposite case."],
["Which account normally has a credit balance?",["Revenue","Cash","Rent expense","Equipment"],"Assets and expenses are normally debit balances; liabilities, equity and revenue are normally credit balances."],
["What does a trial balance prove?",["Total debits equal total credits","The books have no errors","Taxes are paid","Cash equals profit"],"It only proves the books balance; a wrong account or a missing entry can still hide."],
["Which statement shows assets, liabilities and equity on one date?",["Balance sheet","Income statement","Cash flow statement","Tax return"],"The balance sheet is a snapshot; the income statement covers a period."],
["What is the monthly close?",["Finalizing a month of books: reconcile, review, post adjustments, run reports","Closing the office for the month","Filing taxes","Cancelling client accounts"],"Typical order: reconcile bank and card accounts, review A/R and A/P, post adjustments, run reports, review."],
["A client prepays $1,200 for services you will deliver next month. On receipt it is:",["A liability (unearned revenue)","Revenue","An expense","Equity"],"Under accrual accounting it is not earned yet, so it is a liability until the service is delivered."],
["Depreciation is:",["Spreading an asset cost over its useful life","The loss of cash","A tax payment","A bank fee"],"Straight-line: (cost - salvage value) / years of life."]],
t:[
["Which form reports wages paid to an employee?",["W-2","1099-NEC","K-1","1098"],"Employers issue W-2s; contractors receive a 1099-NEC for nonemployee compensation."],
["A client owns part of a partnership. Which document shows their share of income?",["Schedule K-1","Form W-2","Form 1098","Form 4868"],"The partnership or S-corp issues K-1s with its return, usually by March 15 unless extended."],
["Bank interest is reported to the client on:",["Form 1099-INT","Form 1099-DIV","Form W-2","Form 1098"],"1099-INT reports interest; 1099-DIV reports dividends."],
["Mortgage interest paid is reported on:",["Form 1098","Form 1099-G","Form W-4","Form 4868"],"Lenders send Form 1098. Form 1099-G reports government payments such as unemployment."],
["A client needs more time to file a personal return. Which form?",["Form 4868","Form 7004","Form 1065","Form 1099-NEC"],"Form 4868 extends the filing date, usually to Oct 15. It does not extend time to pay."],
["Which form authorizes the preparer to e-file an individual return?",["Form 8879","Form 4868","Form 1099-NEC","Form W-2"],"Form 8879 is the IRS e-file signature authorization; firms often collect it through the portal with e-signature."],
["An engagement letter is signed to:",["Define services, fees and responsibilities before work starts","File the return","Request an extension","Report income"],"It sets scope and expectations and protects both the firm and the client."],
["A client has not sent a requested document. Best next step?",["Follow up with a clear list and date, and log it","Wait until the deadline","Estimate the numbers","File without it"],"Polite, specific, repeated follow-up with a log keeps the file moving. Never guess figures."],
["An IRS letter arrives for a client. What do you do first?",["Log it (date, notice number, client, deadline) and route it to the right team member","Tell the client to ignore it","Reply to the IRS yourself","File it without logging"],"Note the response date. The team member decides the response; you keep the log accurate and on time."],
["A completed return is ready. What happens before e-filing?",["The client reviews and signs the authorization","Nothing, you file it","A verbal OK is enough","The client pays the IRS"],"A signed authorization is required first; follow up until you have it."],
["Where should clients send sensitive documents?",["The secure client portal","Plain email","Text message","Social media message"],"Portals protect and log uploads; guide clients to use them."],
["Does Florida have a state personal income tax?",["No","Yes, 5%","Yes, 3%","Only on investments"],"Florida has no state personal income tax. Business taxes such as sales tax and corporate income tax still exist."]],
cases:[
["Client document tracker","Sheets",6,"Track W-2, 1099 and K-1 requests for 5 clients.",['Headers: Client, Tax year, Document, Date requested, Status, Days waiting','Add 5 sample rows; format Date requested as a date','Status dropdown: Received, Missing, Pending','Days waiting in F2: =IF(E2="Received","",TODAY()-D2)','Red fill when Status is Missing (conditional formatting)','Freeze row 1, add a filter, show only Missing','Count missing items: =COUNTIF(E2:E6,"Missing")'],'Key formulas: =IF(E2="Received","",TODAY()-D2) and =COUNTIF(E2:E6,"Missing"). Narrate why: the dropdown keeps data clean and the rule makes gaps visible.'],
["Invoice aging","Sheets",7,"Chase unpaid invoices by how late they are.",['Headers: Invoice, Client, Date, Amount, Status, Due, Days overdue','Due in F2: =C2+30','Days overdue in G2: =IF(E2="Paid","",MAX(0,TODAY()-F2))','Bucket column: =IF(G2="","Paid",IF(G2<=30,"0-30",IF(G2<=60,"31-60","61+")))','Total outstanding: =SUMIF(E2:E20,"<>Paid",D2:D20)','Pivot table: outstanding amount by client'],'Say why aging matters: older balances need earlier follow-up. IFS also works for the buckets.'],
["Deadline and e-file tracker","Sheets",6,"Keep returns, extensions and e-file status in one place.",['Headers: Client, Return, Due date, Extended, E-file status','Return dropdown: 1040, 1065, 1120-S, 1120','Extended: Yes/No. E-file status: Not started, Submitted, Accepted, Rejected','Highlight due dates within 14 days: =AND($C2-TODAY()>=0,$C2-TODAY()<=14)','Sort by due date and filter on E-file status'],'Dates: 1040 and 1120 April 15; 1065 and 1120-S March 15. Extensions: Form 4868 to Oct 15; Form 7004 to Sept 15 (partnerships, S-corps) or Oct 15 (C-corps).'],
["IRS and state letter log","Sheets",5,"Log every notice and route it to the right person.",['Headers: Date received, Agency, Notice number, Client, Tax year, Response by, Assigned to, Status','Dropdowns: Agency (IRS, State) and Status (New, In progress, Sent, Closed)','Days left in I2: =F2-TODAY()','Filter by Assigned to, then sort by Days left','Protect the sheet (Data > Protect sheets and ranges): it is confidential'],'Use the response date printed on the notice. Never paste tax IDs into the log; use client name and notice number.'],
["Messy client list cleanup","Sheets",5,"A pasted list has bad spacing, wrong case, duplicates and text dates.",['Paste 6 rows such as "  maria LOPEZ " with two duplicates','Trim: Data > Data cleanup > Trim whitespace','Capitalize: =PROPER(A2) in a helper column, then paste values (Ctrl+Shift+V)','Remove duplicates: Data > Data cleanup > Remove duplicates','Convert text dates: =DATEVALUE(C2), then format as date','Split "Lopez, Maria": Data > Split text to columns'],'Work on a copy first. Paste as values before deleting helper columns.'],
["Schedule a client call","Calendar",5,"A Miami client wants Tuesday at 2:00 PM ET.",['Create the event: Tax prep call - Maria Lopez, 30 minutes','Set the event time zone to Eastern','Add the guest email and a video link','Description: documents to bring and the portal link','Notifications: 1 day before and 30 minutes before','Move it to Wednesday 11:00 AM with Find a time and notify the guest'],'Confirm the time in both zones out loud when you finish. Keep the description short and friendly.'],
["Tax season calendar","Calendar",7,"Set up the firm deadlines and your own routine.",['Create a calendar named Tax Deadlines with its own color','Add all-day events: Mar 15, Apr 15 and Oct 15, 2027','Add notifications 14 days and 3 days before each','Share the calendar: See all event details','Create a weekly Monday 10:00 AM ET meeting (recurring)','Create a daily 1:00 PM lunch block, Monday to Friday','Set working hours: Mon-Fri 9:00-18:00'],'Change one occurrence with This event, the rest with This and following.'],
["Bank reconciliation","Accounting",8,"Match a bank statement to the books for one month.",['Two tabs, Bank and Books, each with Date, Description, Amount','In Books, add Matched: =IF(COUNTIF(Bank!C:C,C2)>0,"Yes","No")','Filter Matched = No: these are outstanding checks or deposits in transit','Adjusted bank balance = statement balance - outstanding checks + deposits in transit','Adjusted book balance = book balance - bank fees + interest earned','Difference cell: =B1-B2, red if it is not 0'],'Say why each reconciling item exists. Both adjusted balances must agree before you stop.'],
["Month-end close checklist","Accounting",6,"Run a clean monthly close for a small client.",['Rows with checkboxes: bank reconciled, cards reconciled, A/R reviewed, A/P reviewed, adjustments posted, reports reviewed','Add Owner and Done date columns','Progress: =COUNTIF(B2:B7,TRUE)/COUNTA(A2:A7)','Conditional formatting: progress cell turns green at 100%','Add a Notes column for questions to ask the client'],'Explain the order: reconcile first, review balances, post adjustments, then run reports.'],
["Journal entries to trial balance","Accounting",8,"Entries: 1) owner invests $5,000; 2) buy equipment $2,000 cash; 3) earn $1,500 cash revenue; 4) pay $400 rent; 5) invoice a client $800; 6) client pays the $800.",['Columns: Date, Account, Debit, Credit','Enter all six entries with debits equal to credits in each','Totals: =SUM(C2:C20) and =SUM(D2:D20)','Check cell: =IF(SUM(C:C)=SUM(D:D),"Balanced","Check entries")','Build the trial balance with SUMIFS or a pivot table by account'],'Check: cash ends at $4,900, revenue is $2,300, and assets of $6,900 equal equity of $5,000 plus net income of $1,900.'],
["Client onboarding workflow","Accounting",6,"Take a new client from engagement letter to documents received.",['Columns: Client, Letter sent, Signed, Portal invite, Organizer sent, Docs received, Notes','Use checkboxes for the stages in B to F','Next action in H2: =IF(NOT(B2),"Send letter",IF(NOT(C2),"Chase signature",IF(NOT(D2),"Send portal invite",IF(NOT(E2),"Send organizer",IF(NOT(F2),"Chase documents","Ready for preparer")))))','Filter by Next action to build today follow-up list','Write the follow-up email in English and Spanish'],'Gaps are visible at a glance. Keep client messages short, specific and dated.']],
cards:[
["Tell me about yourself. (English)","Structure: current skills, then relevant past (customer contact, Excel, bilingual work), then why this role. Aim for 60 to 90 seconds with one real example. Use only true facts."],
["¿Por qué quieres este puesto? (Spanish)","Une tres ideas reales: tu trato con clientes, tu orden con datos y Excel, y tu interés en aprender contabilidad. Cierra con tu disponibilidad en horario del Este."],
["Describe a difficult customer you helped.","STAR: Situation, Task, Action (listen, empathize, offer a next step), Result. Keep it under 90 seconds and show calm and follow-up."],
["Explain W-2, 1099 and K-1 simply.","W-2: wages from an employer. 1099: contractor or other income. K-1: your share of profit from a partnership or S-corp. All feed the tax return."],
["Pídele a un cliente su W-2 (Spanish)","Buenos días, [nombre]. Le habla [su nombre] de Accounting Group of South Florida. Aún nos falta su W-2: sin él no podemos preparar su declaración con exactitud. ¿Puede subirlo al portal antes del [fecha]? Con gusto le ayudo."],
["What is a tax extension?","More time to file, not to pay. Individuals: Form 4868 to Oct 15. Partnerships and S-corps: Form 7004 to Sept 15."],
["Assets, liabilities, debits and credits","Assets = Liabilities + Equity. Debits increase assets and expenses; credits increase liabilities, equity and revenue. Every entry balances."],
["Cash vs accrual; what is a bank reconciliation?","Cash: record when money moves. Accrual: record when earned or incurred. Reconciliation: match the bank statement to the books and explain differences (outstanding checks, deposits in transit, fees)."],
["Can you work Saturdays? What if your internet or power fails?","Be honest and concrete: confirm availability, then describe your real backup (hotspot, power backup, alternate location) and say you would alert the team immediately."],
["Spanish glossary","engagement letter = carta de compromiso · tax organizer = organizador de impuestos · return = declaración · extension = prórroga · invoice = factura · deadline = fecha límite · portal = portal del cliente · e-signature = firma electrónica"],
["Questions you can ask them","What does a typical week look like? How is success measured in the first 90 days? What training do you give on TaxDome and QuickBooks?"],
["Walk me through onboarding a new client.","Engagement letter and signature, then portal setup, then tax organizer and document checklist, then follow-ups until everything is in. Log every step so nothing is lost."],
["¿Qué es una conciliación bancaria? (Spanish)","Es comparar el estado de cuenta del banco con los libros contables y explicar las diferencias (cheques pendientes, depósitos en tránsito, comisiones) hasta que los saldos coincidan."],
["What does the monthly close involve?","Reconcile bank and card accounts, review receivables and payables, post adjustments, run reports, review for errors, and list open questions for the client."],
["A client cannot find their K-1. What do you say?","Stay helpful: explain what a K-1 is and who issues it (the partnership or S-corp), ask them to check the portal and email, offer to contact the issuer through your supervisor, and give a date for the next follow-up."],
["¿Cómo das seguimiento al pago de una factura? (Spanish)","Un recordatorio amable antes del vencimiento, otro al día siguiente, luego una llamada y aviso a tu supervisor si sigue pendiente. Siempre registra cada contacto."],
["Why is attention to detail critical in this role?","Numbers, names, tax IDs and dates must be exact. Give one real example of double-checking your work and describe your habit (checklists, re-reading, matching totals)."]]};
